name: Refresh profile graphics
on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Generate graphics from GitHub data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/update_profile.py
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: Sarthakgupta7
          outputs: |
            assets/snake-dark.svg?palette=github-dark&color_snake=#b59aff
            assets/snake-light.svg?palette=github-light&color_snake=#8250df
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Save refreshed graphics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          if ! git diff --staged --quiet; then
            git commit -m "Refresh profile activity graphics"
            git push
          fi
